name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check .

      - name: Smoke test
        run: |
          python -c "import librosa, torch, transformers; print('imports ok')"
          # PREENCHER: substitua pela chamada real do pipeline sobre um áudio
          # curto em samples/, para o CI provar que o código executa ponta a ponta.
          # Ex.: python asr_compare.py --input samples/short.wav --dry-run
